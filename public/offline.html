<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1d1d1b" />
    <title>Canvasly is offline</title>
    <style>
      * { box-sizing: border-box; }
      body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 24px; color: #242421; background: #efeeeb; font-family: Inter, system-ui, sans-serif; }
      main { max-width: 360px; padding: 32px; text-align: center; background: #fff; border: 1px solid #dfdedb; border-radius: 18px; box-shadow: 0 12px 36px rgba(0,0,0,.08); }
      .mark { width: 42px; height: 42px; display: grid; grid-template-columns: 1fr 1fr; gap: 3px; padding: 7px; margin: auto auto 20px; background: #1d1d1b; border-radius: 11px; }
      .mark span { background: #d5ff65; border-radius: 3px; }.mark span:first-child { grid-row: span 2; }
      h1 { margin: 0 0 8px; font-size: 21px; } p { margin: 0; color: #6f6d67; font-size: 14px; line-height: 1.5; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark"><span></span><span></span><span></span></div>
      <h1>Canvasly is offline</h1>
      <p>Reconnect once to finish downloading the app, then your local projects will be ready to use without a connection.</p>
    </main>
  </body>
</html>
